name: Publish

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.ok([version, `v${version}`].includes(process.env.RELEASE_TAG), 'Release tag must match package.json version');
          JS

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: |
          npm run lint
          npm run lint:sass:unused

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:browser -- --project=chromium --workers=4

      - name: Verify generated bundles are current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git status --short --untracked-files=all -- dist
            echo "::error::Generated bundles must be current and tracked. Run npm run build and commit dist."
            exit 1
          fi

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish to npm
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --provenance --tag "$NPM_DIST_TAG"
