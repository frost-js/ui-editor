<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/frost-ui.css">
    <link rel="stylesheet" href="/assets/frost-ui-editor.css">
    <style>
        * {
            scrollbar-gutter: stable;
        }
    </style>
    <title>Frost UI Editor tests</title>
    <script type="importmap">
        {"imports": {
            "@fr0st/core": "/assets/frost-core.esm.js",
            "@fr0st/query": "/assets/fquery.esm.js",
            "@fr0st/ui": "/assets/frost-ui.esm.js"
        }}
    </script>
</head>
<body>
    <script type="module">
        import $ from '@fr0st/query';
        import * as UI from '@fr0st/ui';

        const minified = new URL(location.href).searchParams.has('minified');
        const editorModule = await import(minified ? '/assets/frost-ui-editor.esm.min.js' : '/assets/frost-ui-editor.esm.js');
        const { default: Editor } = editorModule;
        window.editorModule = editorModule;
        window.fQuery = window.$ = $;
        window.UI = { ...UI, Editor };
        document.body.dataset.ready = 'true';
    </script>
</body>
</html>
